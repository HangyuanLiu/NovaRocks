syntax = "proto3";

// NovaRocks-native FE<->BE gRPC contract. Top-level package `novarocks` is the
// RPC-envelope package (service + envelope messages only). Domain messages move
// to novarocks.{plan,expr,filter,common} subpackages in NIDL-1/2/3.
//
// Discipline: tag numbers are append-only; comments document semantics and
// RPC/message owner paths where applicable.
package novarocks;

import "common.proto";
// internal_service.proto (package starrocks) provides PTransmitRuntimeFilter*
// and PLookUp* used by the two RPCs below. NIDL-2 replaces those signatures with
// novarocks.filter messages and drops this import.
import "internal_service.proto";
// LOAD-BEARING import, NOT dead. No `lake.`/`starrocks.` type from this file is
// referenced syntactically here, but this import is the SOLE anchor that pulls
// lake_service.proto into the non-compat transitive compile, which is what emits
// proto::starrocks::{TxnInfoPb, TxnLogPb, PublishVersionRequest, ...}. Those are
// consumed by src/connector/starrocks/lake/** (currently ungated, in the default
// build). Removing this import breaks the pure build. Real home: NIDL-D1 gates
// the lake module, after which this anchor moves under the compat compile.
import "lake_service.proto";

// FE<->BE control + data-plane RPC surface. One service, all cluster-internal
// traffic. Consumers: src/service/grpc_server.rs (server), src/service/
// grpc_client.rs + src/runtime/dispatcher.rs + src/runtime/heartbeat_mgr.rs +
// src/service/standalone_exec_state_reporter.rs (clients).
service NovaRocksGrpc {
  // Streaming exchange shuffle: sender streams chunk payloads to a receiver
  // fragment instance. Producer: src/service/exchange_sender.rs. Consumer:
  // src/service/grpc_server.rs -> src/runtime/exchange.rs.
  rpc Exchange(stream ExchangeRequest) returns (stream ExchangeResponse);
  // Single-message exchange path used by the current gRPC sender.
  rpc ExchangeUnary(ExchangeRequest) returns (ExchangeResponse);
  // Runtime-filter propagation. NIDL-2: retype to novarocks.filter.
  rpc TransmitRuntimeFilter(starrocks.PTransmitRuntimeFilterParams)
      returns (starrocks.PTransmitRuntimeFilterResult);
  // Point lookup (fetch-by-key). NIDL-2: retype to novarocks.filter.
  rpc Lookup(starrocks.PLookUpRequest) returns (starrocks.PLookUpResponse);

  // Coordinator -> BE fragment submission. payload is a thrift-encoded
  // TExecPlanFragmentParams today; NIDL-4 adds native plan + instance_params.
  rpc SubmitFragment(SubmitFragmentRequest) returns (SubmitFragmentResponse);
  // Coordinator polls a fragment instance for result batches.
  rpc FetchResult(FetchResultRequest) returns (FetchResultResponse);
  // Coordinator cancels one or more fragment instances.
  rpc CancelFragment(CancelFragmentRequest) returns (CancelFragmentResponse);
  // FE-pull cluster heartbeat (unary). Consumer: src/runtime/heartbeat_mgr.rs.
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);

  // BE -> coordinator exec-status report (distributed write). Producer:
  // src/service/standalone_exec_state_reporter.rs. Consumer: grpc_server.rs.
  rpc ReportExecStatus(ReportExecStatusRequest)
      returns (ReportExecStatusResponse);
  // Batched variant of ReportExecStatus.
  rpc BatchReportExecStatus(BatchReportExecStatusRequest)
      returns (BatchReportExecStatusResponse);
}

// One exchange shuffle chunk in flight from a sender to a receiver instance.
message ExchangeRequest {
  int64 finst_id_hi = 1;   // receiver fragment-instance id, high 64 bits
  int64 finst_id_lo = 2;   // receiver fragment-instance id, low 64 bits
  int32 node_id = 3;       // destination exchange node id within the fragment
  int32 sender_id = 4;     // sender ordinal (for per-sender EOS tracking)
  int32 be_number = 5;     // sender BE ordinal
  bool eos = 6;            // true on this sender's final message
  int64 sequence = 7;      // monotonic per-sender sequence for ordering/ack
  bytes payload = 8;       // NRX1-framed Arrow IPC chunk (src/runtime/exchange.rs)
}

// Ack for one ExchangeRequest.
message ExchangeResponse {
  int64 ack_sequence = 1;  // sequence value accepted for this request
}

// SubmitFragment payload. Thrift bytes today; NIDL-4 adds native fields.
message SubmitFragmentRequest {
  bytes exec_plan_fragment_params_thrift = 1;  // serialized TExecPlanFragmentParams
}

// SubmitFragment acceptance result returned by the destination BE.
message SubmitFragmentResponse {
  int32 status_code = 1;   // 0 == accepted; nonzero == rejected
  string message = 2;      // human-readable rejection detail
}

// Coordinator long-poll request for one fragment instance result stream.
message FetchResultRequest {
  novarocks.common.UniqueId finst_id = 1;  // instance to poll
  int64 max_wait_ms = 2;                   // server-side long-poll budget
}

// FetchResult response containing readiness state plus one optional Arrow IPC payload.
message FetchResultResponse {
  enum Status {
    RESULT_STATUS_UNSPECIFIED = 0;  // NIDL-1: fixes former READY = 0 default hazard
    READY = 1;
    NOT_READY = 2;
    EOF = 3;
    ERROR = 4;
  }
  Status status = 1;             // result lifecycle state for this poll
  string message = 2;            // error detail when status == ERROR
  int64 packet_seq = 3;          // was carried in the FetchResult struct
  bool eos = 4;                  // end-of-stream marker
  bytes result_arrow_ipc = 5;    // NRX1-framed Arrow IPC (sole data track)
}

// Coordinator cancellation request for active fragment instances.
message CancelFragmentRequest {
  repeated novarocks.common.UniqueId finst_ids = 1;  // instances to cancel
  string reason = 2;                                // cancellation reason for logging
  uint64 start_epoch = 3;                           // guard: ignore if BE restarted past epoch
}

// Cancellation result returned after local cancellation handling.
message CancelFragmentResponse {
  int32 status_code = 1;  // 0 == cancellation accepted
}

// FE-pull heartbeat request. Consumer: src/runtime/heartbeat_mgr.rs.
message HeartbeatRequest {
  uint32 assigned_be_id = 1;  // id the FE assigns to this BE
  int64 fe_epoch = 2;         // FE epoch for split-brain detection
}

// BE heartbeat state returned to the FE poller.
message HeartbeatResponse {
  uint64 start_epoch = 1;  // BE process start epoch (restart detection)
  string version = 2;      // BE build version
  uint32 num_cores = 3;    // available cores for scheduling
  int32 status_code = 4;   // 0 == healthy
}

// Native recursive runtime profile. Replaces the flat thrift
// TRuntimeProfileNode list plus num_children encoding for NovaRocks-native
// control-plane consumers. Producer: src/runtime/profile.rs. Consumer:
// src/service/fe_report.rs for multi-fragment merge and EXPLAIN ANALYZE paths.
message RuntimeProfileTree {
  ProfileNode root = 1;  // root profile node for one fragment profile tree
}

// One runtime profile node with native recursive children.
message ProfileNode {
  string name = 1;                         // display name of the profile node
  int32 node_id = 2;                       // plan node id; was TRuntimeProfileNode.metadata
  repeated Counter counters = 3;           // counters owned by this profile node
  map<string, string> info_strings = 4;    // informational key/value strings
  repeated ProfileNode children = 5;       // child profile nodes in display order
}

// Runtime counter value and display hierarchy metadata.
message Counter {
  string name = 1;          // counter display name
  string parent_name = 2;   // empty string means this is a root-level counter
  ProfileUnit unit = 3;     // counter value unit
  int64 value = 4;          // current counter value
  optional int64 min_value = 5;  // merged minimum value, if available
  optional int64 max_value = 6;  // merged maximum value, if available
}

// Runtime profile counter units. Mirrors thrift metrics.TUnit values used by
// src/runtime/profile.rs, with an explicit unspecified zero value for proto3.
enum ProfileUnit {
  PROFILE_UNIT_UNSPECIFIED = 0;
  PROFILE_UNIT_UNIT = 1;
  PROFILE_UNIT_CPU_TICKS = 2;
  PROFILE_UNIT_BYTES = 3;
  PROFILE_UNIT_TIME_NS = 4;
  PROFILE_UNIT_TIME_MS = 5;
  PROFILE_UNIT_TIME_S = 6;
  PROFILE_UNIT_NONE = 7;
}

// Optional list wrappers preserve the thrift distinction between an absent list
// field and a present-but-empty list field for Iceberg commit metadata.
message Int64List {
  repeated int64 values = 1;
}

message Int32List {
  repeated int32 values = 1;
}

// Native Iceberg file content enum. Mirrors TIcebergFileContent values carried
// in the FE-compatible thrift path.
enum IcebergFileContent {
  ICEBERG_FILE_CONTENT_UNSPECIFIED = 0;
  DATA = 1;
  POSITION_DELETES = 2;
  EQUALITY_DELETES = 3;
}

// Native Iceberg column statistics for one data/delete file.
message IcebergColumnStats {
  map<int32, int64> column_sizes = 1;
  map<int32, int64> value_counts = 2;
  map<int32, int64> null_value_counts = 3;
  map<int32, int64> nan_value_counts = 4;
  map<int32, bytes> lower_bounds = 5;
  map<int32, bytes> upper_bounds = 6;
}

// One serialized Iceberg partition value. datum_bytes is optional because empty
// bytes can be a real encoded value distinct from thrift absence.
message IcebergPartitionValue {
  optional bool is_null = 1;
  optional bytes datum_bytes = 2;
}

// Native Iceberg partition descriptor used by the writer->coordinator report.
message IcebergPartitionDescriptor {
  repeated IcebergPartitionValue values = 1;
}

// Native Iceberg data/delete file commit metadata. This mirrors the
// NovaRocks-internal TIcebergDataFile fields needed by pure-mode commits.
message IcebergDataFile {
  optional string path = 1;
  optional string format = 2;
  optional int64 record_count = 3;
  optional int64 file_size_in_bytes = 4;
  optional string partition_path = 5;
  Int64List split_offsets = 6;
  IcebergColumnStats column_stats = 7;
  optional string partition_null_fingerprint = 8;
  IcebergFileContent file_content = 9;
  optional string referenced_data_file = 10;
  optional int64 first_row_id = 11;
  Int32List equality_ids = 12;
  optional bytes key_metadata = 13;
  optional int32 partition_spec_id = 14;
  IcebergPartitionDescriptor partition_values_descriptor = 15;
  optional int64 content_offset = 16;
  optional int64 content_size_in_bytes = 17;
  optional int64 cardinality = 18;
}

// Native sink commit info for pure NovaRocks report path. Hive/tablet/load-only
// fields stay on the StarRocksFrontend thrift compatibility path.
message IcebergCommitInfo {
  IcebergDataFile iceberg_data_file = 1;
  optional bool is_overwrite = 2;
  optional bool is_rewrite = 3;
}

// Native BE -> coordinator exec-status report. Used only on the pure
// NovaRocksCoordinator gRPC path; StarRocksFrontend compatibility keeps thrift.
message ExecStatusReport {
  novarocks.common.UniqueId query_id = 1;
  novarocks.common.UniqueId fragment_instance_id = 2;
  int32 backend_num = 3;
  novarocks.common.Status status = 4;
  bool done = 5;
  repeated IcebergCommitInfo iceberg_commits = 6;
  int64 loaded_rows = 7;
  int64 sink_load_bytes = 8;
  int64 filtered_rows = 9;
  RuntimeProfileTree profile = 10;  // absent unless ANALYZE/profile enabled
}

// BE -> coordinator exec-status report.
message ReportExecStatusRequest {
  ExecStatusReport report = 1;
}

// Result for one exec-status report accepted by the coordinator.
message ReportExecStatusResponse {
  int32 status_code = 1;  // 0 == report accepted
  string message = 2;     // human-readable status or error detail
  string error_code = 3;  // machine-readable error code when nonzero
}

// Batched exec-status reports from one BE to the coordinator.
message BatchReportExecStatusRequest {
  repeated ExecStatusReport reports = 1;
}

// Aggregate result for a batch of exec-status reports.
message BatchReportExecStatusResponse {
  int32 status_code = 1;  // 0 == batch accepted
  string message = 2;     // human-readable status or error detail
  string error_code = 3;  // machine-readable error code when nonzero
}
