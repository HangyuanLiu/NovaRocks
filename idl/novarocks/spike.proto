syntax = "proto3";

// NIDL-0 conversion-layer ergonomics spike. TEMPORARY.
//
// TOMBSTONE: delete this file, the crate::proto::spike wiring in src/build.rs,
// src/service/proto_spike.rs, and the `#[cfg(test)] mod proto_spike;` line in
// src/service/mod.rs when NIDL-3 (plan-face contract freeze) lands.
//
// Deliberately fake domain names (Spike*) so this is never mistaken for the real
// NIDL-3 plan contract. It probes exactly the prost properties NIDL-3 depends on.
package novarocks.spike;

// (Finding #1) Recursive message — probes prost's Box handling for a self-
// referential type, mirroring NIDL-3's List<Struct<...>> nested TypeDesc need.
message SpikeType {
  oneof kind {
    SpikeScalar scalar = 1;  // scalar leaf shape for recursive type conversion
    SpikeList list = 2;      // nested list branch that forces recursive boxing
    SpikeStruct strct = 3;   // struct branch; name intentionally exposes Strct
  }
}

// Scalar leaf used by the recursive type probe.
message SpikeScalar {
  int32 type_id = 1;  // fake scalar id carried through the conversion layer
}

// List branch used to observe prost boxing for recursive message fields.
message SpikeList {
  SpikeType element = 1;  // recursive -> prost decides where to Box
}

// Struct branch used to observe repeated nested fields inside recursive types.
message SpikeStruct {
  repeated SpikeField fields = 1;  // named fields carried by the struct branch
}

// One named field inside a SpikeStruct.
message SpikeField {
  string name = 1;           // field name preserved by roundtrip tests
  SpikeType field_type = 2;  // recursive field type
}

// (Finding #2) Large oneof — probes exhaustive-match ergonomics on the generated
// Rust enum (the core win over thrift's optional-field soup).
message SpikeNode {
  int32 node_id = 1;                // stable node id used by roundtrip tests
  repeated SpikeNode children = 2;  // child nodes for recursive tree shape
  oneof payload {
    SpikeUnit arm01 = 10;  // wide-oneof arm 1
    SpikeUnit arm02 = 11;  // wide-oneof arm 2
    SpikeUnit arm03 = 12;  // wide-oneof arm 3
    SpikeUnit arm04 = 13;  // wide-oneof arm 4
    SpikeUnit arm05 = 14;  // wide-oneof arm 5
    SpikeUnit arm06 = 15;  // wide-oneof arm 6
    SpikeUnit arm07 = 16;  // wide-oneof arm 7
    SpikeUnit arm08 = 17;  // wide-oneof arm 8
    SpikeUnit arm09 = 18;  // wide-oneof arm 9
    SpikeUnit arm10 = 19;  // wide-oneof arm 10
    SpikeUnit arm11 = 20;  // wide-oneof arm 11
    SpikeUnit arm12 = 21;  // wide-oneof arm 12
  }
}

// Shared payload for the wide oneof arms; intentionally simple for this spike.
message SpikeUnit {
  int64 value = 1;  // value preserved by wide-oneof roundtrip tests
}
