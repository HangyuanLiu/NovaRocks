syntax = "proto3";
package novarocks.filter;

import "common.proto";  // novarocks.common.{Status, UniqueId, TypeDesc}

// Runtime-filter transmission. Producer: src/exec/operators/hashjoin/
// hash_join_build_sink.rs + src/runtime/runtime_filter_worker.rs. Consumer:
// src/service/internal_rpc.rs. Replaces starrocks.PTransmitRuntimeFilterParams
// (16 fields; NovaRocks consumed 6).
message TransmitRuntimeFilterRequest {
  bool is_partial = 1;                          // route: partial->merge, full->probe
  novarocks.common.UniqueId query_id = 2;       // query that owns the runtime filter
  int32 filter_id = 3;                          // runtime-filter id within the query
  bytes data = 4;                               // RF codec payload (opaque; RF_VERSION_V3)
  int32 build_be_number = 5;                    // meaningful only when is_partial
  novarocks.common.TypeDesc column_type = 6;    // optional; infers build data type
}

// Runtime-filter transmission acknowledgement. Producer: src/service/internal_rpc.rs.
// Consumer: src/runtime/runtime_filter_worker.rs and hash-join sender path.
message TransmitRuntimeFilterResponse {
  novarocks.common.Status status = 1;           // transmission result
  int32 filter_id = 2;                          // runtime-filter id acknowledged
}

// Point lookup (row-position fetch; used by Iceberg v3 pure mode). Producer:
// src/exec/operators/fetch_processor.rs. Consumer: src/service/internal_rpc.rs
// -> src/runtime/lookup.rs. Replaces starrocks.PLookUpRequest/Response.
message LookupRequest {
  novarocks.common.UniqueId query_id = 1;       // query that owns the lookup request
  int32 lookup_node_id = 2;                     // lookup plan node that serves the fetch
  int32 request_tuple_id = 3;                   // tuple id for requested row positions
  repeated Column request_columns = 4;          // row-position references
}

// Point lookup response payload. Producer: src/runtime/lookup.rs through
// src/service/internal_rpc.rs. Consumer: src/exec/operators/fetch_processor.rs.
message LookupResponse {
  novarocks.common.Status status = 1;           // lookup result status
  repeated Column columns = 2;                  // fetched columns encoded as Arrow IPC
}

// One lookup column payload. Producer and consumer follow the owning lookup
// request/response paths; data remains opaque to the IDL layer.
message Column {
  int32 slot_id = 1;                            // destination/request slot id
  int64 data_size = 2;                          // decoded byte size for accounting
  bytes data = 3;                               // Arrow IPC streaming (opaque)
}

enum RuntimeFilterEnvelopeKind {
  RUNTIME_FILTER_ENVELOPE_KIND_UNSPECIFIED = 0;
  RUNTIME_FILTER_ENVELOPE_KIND_CONTRIBUTION = 1;
  RUNTIME_FILTER_ENVELOPE_KIND_ARTIFACT = 2;
  RUNTIME_FILTER_ENVELOPE_KIND_PRODUCER_CLOSED = 3;
  RUNTIME_FILTER_ENVELOPE_KIND_UNAVAILABLE = 4;
  RUNTIME_FILTER_ENVELOPE_KIND_ACK = 5;
}

message RuntimeFilterContributionRouteIdentity {
  uint32 producer_binding_id = 1;
  novarocks.common.UniqueId fragment_instance_id = 2;
  uint32 partition_id = 3;
  uint64 sequence = 4;
}

message RuntimeFilterDeliveryRouteIdentity {
  uint32 route_edge_id = 1;
  uint64 sequence = 2;
}

message RuntimeFilterRouteIdentity {
  oneof value {
    RuntimeFilterContributionRouteIdentity contribution = 1;
    RuntimeFilterDeliveryRouteIdentity delivery = 2;
  }
}

message RuntimeFilterEnvelope {
  RuntimeFilterEnvelopeKind kind = 1;
  novarocks.common.UniqueId query_id = 2;
  uint32 channel_id = 3;
  uint64 deployment_epoch = 4;
  RuntimeFilterRouteIdentity route_identity = 5;
  bytes schema_digest = 6;
  bytes payload = 7;
}

enum RuntimeFilterAcceptStatus {
  RUNTIME_FILTER_ACCEPT_STATUS_UNSPECIFIED = 0;
  RUNTIME_FILTER_ACCEPT_STATUS_ACCEPTED = 1;
  RUNTIME_FILTER_ACCEPT_STATUS_DUPLICATE = 2;
  RUNTIME_FILTER_ACCEPT_STATUS_REJECTED = 3;
}

message RuntimeFilterEnvelopeResponse {
  RuntimeFilterRouteIdentity acked_route_identity = 1;
  RuntimeFilterAcceptStatus accept_status = 2;
  string rejection_reason = 3;
}
