syntax = "proto3";

package novarocks.physical_type_v2;

import "arrow_type.proto";
import "value_type.proto";

// Flat type vocabulary for the v2 physical package. This file is a component,
// not a fragment envelope. Carrier, field and value-type IDs have separate
// sparse namespaces; zero is a valid identity, never an absence sentinel.
// Repeated tables reject duplicate identities. References must resolve to an
// actual table entry; receivers allocate by entry count, not by maximum ID.
message TypeTable {
  repeated CarrierTypeDefinition carriers = 1;
  repeated FieldDefinition fields = 2;
  repeated ValueTypeDefinition value_types = 3;
  // Shared semantic definitions in this TypeTable's separate logical namespace.
  repeated novarocks.value_type.LogicalTypeDefinition logical_types = 4;
}

// Source attributes have their own field namespace. The shape is the same
// flat Carrier/Field grammar, with no execution definitions/references and no
// attributes on its Field definitions. Every shape Field, including unused
// definitions, has exactly one facts row; identity presence is required.
message SourceFieldTable {
  TypeTable shape = 1;
  repeated SourceArrowFieldFacts field_facts = 2;
}
message SourceArrowFieldFacts {
  optional uint32 field_id = 1;
  repeated novarocks.arrow_type.ArrowFieldMetadataEntry metadata = 2;
  optional int64 dictionary_id = 3;
  optional bool dictionary_is_ordered = 4;
}

// Explicit logical identity is independent of the Arrow carrier. UNSPECIFIED
// is invalid; FixedSizeBinary(16) alone does not imply LARGEINT or UUID.
enum LogicalType {
  LOGICAL_TYPE_UNSPECIFIED = 0;
  LOGICAL_TYPE_PHYSICAL = 1;
  LOGICAL_TYPE_JSON = 2;
  LOGICAL_TYPE_VARIANT = 3;
  LOGICAL_TYPE_HLL = 4;
  LOGICAL_TYPE_BITMAP = 5;
  LOGICAL_TYPE_OBJECT = 6;
  LOGICAL_TYPE_PERCENTILE = 7;
  LOGICAL_TYPE_LARGE_INT = 8;
  LOGICAL_TYPE_UUID = 9;
}

message ValueTypeDefinition {
  uint32 id = 1;
  optional uint32 carrier_type_id = 2;
  reserved 3, 4;
  reserved "nullable", "logical_type";
  // Complete recursive semantics belong solely to the referenced logical node.
  optional uint32 logical_type_id = 5;
}

// Execution fields are metadata-free layout facts with explicit references.
// Source attributes live exclusively in SourceFieldTable side rows. Retired
// inline attribute slots and names remain permanently reserved.
message FieldDefinition {
  uint32 id = 1;
  string name = 2;
  bool nullable = 3;
  optional uint32 carrier_type_id = 4;
  reserved 5, 6, 7;
  reserved "metadata", "dictionary_id", "dictionary_is_ordered";
  // References this TypeTable's logical namespace, never another table's ID.
  optional uint32 logical_type_id = 8;
  // Explicit execution projection pairing; its layout remains binding-owned.
  optional uint32 value_binding_id = 9;
}

// Nesting uses table references only. No carrier or field message recursively
// embeds another definition. The application separately enforces semantic
// type depth, expansion, field metadata and allocation bounds.
message CarrierTypeDefinition {
  uint32 id = 1;
  oneof kind {
    novarocks.arrow_type.ArrowPrimitiveType primitive = 2;
    novarocks.arrow_type.ArrowTimestampType timestamp = 3;
    novarocks.arrow_type.ArrowTimeType time32 = 4;
    novarocks.arrow_type.ArrowTimeType time64 = 5;
    novarocks.arrow_type.ArrowTimeType duration = 6;
    novarocks.arrow_type.ArrowIntervalUnit interval = 7;
    int32 fixed_size_binary = 8;
    novarocks.arrow_type.ArrowDecimalType decimal32 = 9;
    novarocks.arrow_type.ArrowDecimalType decimal64 = 10;
    novarocks.arrow_type.ArrowDecimalType decimal128 = 11;
    novarocks.arrow_type.ArrowDecimalType decimal256 = 12;
    uint32 list_field_id = 13;
    uint32 list_view_field_id = 14;
    FixedSizeList fixed_size_list = 15;
    uint32 large_list_field_id = 16;
    uint32 large_list_view_field_id = 17;
    StructFields struct_type = 18;
    UnionFields union_type = 19;
    DictionaryTypes dictionary = 20;
    MapField map = 21;
    RunEndEncodedFields run_end_encoded = 22;
  }
}

message FixedSizeList {
  optional uint32 item_field_id = 1;
  int32 length = 2;
}
message StructFields {
  // Order and repeated field occurrences are significant.
  repeated uint32 field_ids = 1;
}
message UnionField {
  int32 type_id = 1;
  optional uint32 field_id = 2;
}
message UnionFields {
  novarocks.arrow_type.ArrowUnionMode mode = 1;
  repeated UnionField fields = 2;
}
message DictionaryTypes {
  optional uint32 key_type_id = 1;
  optional uint32 value_type_id = 2;
}
message MapField {
  optional uint32 entries_field_id = 1;
  bool ordered = 2;
}
message RunEndEncodedFields {
  optional uint32 run_ends_field_id = 1;
  optional uint32 values_field_id = 2;
}
