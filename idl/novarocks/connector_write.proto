syntax = "proto3";

// NovaRocks-native typed connector write contract.
//
// Two categories cross the FE/BE boundary, and each is its own closed `oneof`.
// A logical writer handle travels FE -> BE inside a plan node; a commit
// fragment travels BE -> FE inside the root write relation. A provider variant
// is selected structurally, never by a class id, message name, or private
// payload, and there is no opaque bytes field standing in for provider
// semantics.
//
// The generic engine moves, counts, and bounds these carriers. It never
// interprets a provider variant: only the exact provider generation that
// produced a value may turn it back into a domain object.
//
// Owner: writer handles are produced by the FE control binding's encoder and
// consumed by the BE execution binding's decoder; commit fragments run the
// opposite direction. Provider semantics belong to the provider that produced
// the variant.
package novarocks.connector_write;

// ---------------------------------------------------------------------------
// Shared Iceberg value shapes
// ---------------------------------------------------------------------------

enum IcebergFileFormat {
  ICEBERG_FILE_FORMAT_UNSPECIFIED = 0;
  ICEBERG_FILE_FORMAT_PARQUET = 1;
  ICEBERG_FILE_FORMAT_PUFFIN = 2;
}

enum IcebergFileContent {
  ICEBERG_FILE_CONTENT_UNSPECIFIED = 0;
  ICEBERG_FILE_CONTENT_DATA = 1;
  ICEBERG_FILE_CONTENT_POSITION_DELETES = 2;
  ICEBERG_FILE_CONTENT_EQUALITY_DELETES = 3;
}

enum IcebergWriteBranch {
  ICEBERG_WRITE_BRANCH_UNSPECIFIED = 0;
  ICEBERG_WRITE_BRANCH_DATA = 1;
  ICEBERG_WRITE_BRANCH_POSITION_DELETE = 2;
  ICEBERG_WRITE_BRANCH_DELETION_VECTOR = 3;
}

enum IcebergCompression {
  ICEBERG_COMPRESSION_UNSPECIFIED = 0;
  ICEBERG_COMPRESSION_NONE = 1;
  ICEBERG_COMPRESSION_SNAPPY = 2;
  ICEBERG_COMPRESSION_GZIP = 3;
  ICEBERG_COMPRESSION_LZ4 = 4;
  ICEBERG_COMPRESSION_ZSTD = 5;
}

// One partition value. Exactly one of "is null" and a datum payload holds; a
// value that claims both, or neither, is a decode error rather than a repaired
// default.
message IcebergPartitionValueDescriptor {
  bool is_null = 1;
  optional bytes datum_bytes = 2;
}

message IcebergPartitionDescriptor {
  repeated IcebergPartitionValueDescriptor values = 1;
}

// The partition an artifact belongs to. `null_fingerprint` distinguishes two
// partitions whose printed paths collide because a null was rendered.
message IcebergArtifactPartition {
  string partition_path = 1;
  string null_fingerprint = 2;
  int32 partition_spec_id = 3;
  IcebergPartitionDescriptor descriptor = 4;
}

// Per-field manifest statistics, keyed by Iceberg field id.
message IcebergColumnStats {
  map<int32, int64> column_sizes = 1;
  map<int32, int64> value_counts = 2;
  map<int32, int64> null_value_counts = 3;
  map<int32, int64> nan_value_counts = 4;
  map<int32, bytes> lower_bounds = 5;
  map<int32, bytes> upper_bounds = 6;
}

message IcebergArtifactMetrics {
  uint64 record_count = 1;
  uint64 file_size_in_bytes = 2;
  repeated int64 split_offsets = 3;
  optional IcebergColumnStats column_stats = 4;
}

// A byte range inside a container file. A Puffin deletion vector is one blob
// inside a file that may hold several, so its position is part of its identity.
message IcebergContentRange {
  int64 offset = 1;
  int64 size_in_bytes = 2;
}

// ---------------------------------------------------------------------------
// Writer handle: the immutable logical write recipe (FE -> BE)
// ---------------------------------------------------------------------------

// The exact table state a write was admitted against.
message IcebergWriteTableFacts {
  string table_uuid = 1;
  string namespace = 2;
  string table_name = 3;
  string table_location = 4;
  string data_location = 5;
  string target_ref = 6;
  optional int64 base_snapshot_id = 7;
  int64 base_sequence_number = 8;
  int32 schema_id = 9;
  int32 default_partition_spec_id = 10;
  uint32 format_version = 11;
}

message IcebergWriterOutput {
  IcebergFileFormat file_format = 1;
  IcebergCompression compression = 2;
  optional uint64 parquet_row_group_size_bytes = 3;
}

// How a data-branch writer derives partition values and row lineage. The
// transform expressions are Iceberg-owned text, not engine expressions.
message IcebergDataBranchRecipe {
  optional string input_schema_json = 1;
  repeated string partition_source_column_names = 2;
  repeated string partition_column_names = 3;
  repeated string transform_exprs = 4;
  bool row_lineage = 5;
}

// Where a backend may reach one object without holding a credential value.
// A route names the access binding to resolve; the secret itself never crosses
// this boundary.
message IcebergStorageRoute {
  string access_binding = 1;
}

// One pre-existing delete artifact a writer must re-read, byte-exactly.
//
// This is the whole point of the deletion-vector inversion: the frontend
// freezes *references*, never content. A backend that cannot read, validate, or
// match one of these fails the query -- it must never treat an unreadable
// reference as an empty old delete set.
message IcebergOldDeleteArtifactRef {
  string path = 1;
  IcebergFileContent content = 2;
  IcebergFileFormat file_format = 3;
  uint64 file_size_in_bytes = 4;
  uint64 record_count = 5;
  optional IcebergContentRange content_range = 6;
  optional string referenced_data_file = 7;
  optional int64 data_sequence_number = 8;
  optional int64 added_snapshot_id = 9;
  int32 partition_spec_id = 10;
  IcebergStorageRoute storage_route = 11;
}

// Every old delete artifact that must be merged for one referenced data file.
message IcebergOldDeleteMergeTarget {
  string data_file_path = 1;
  uint64 data_file_record_count = 2;
  optional int64 data_file_sequence_number = 3;
  IcebergArtifactPartition partition = 4;
  int64 base_snapshot_id = 5;
  repeated IcebergOldDeleteArtifactRef references = 6;
}

// One logical write recipe, copied unchanged to every physical writer
// placement that serves this target.
//
// It carries no operation, cohort, query, attempt, fragment, backend, driver,
// or sink identity, no credential value, and no already-materialized bulk
// object such as a decoded deletion vector.
message IcebergWriterHandle {
  IcebergWriteBranch branch = 1;
  IcebergWriteTableFacts table = 2;
  IcebergWriterOutput output = 3;
  optional IcebergDataBranchRecipe data = 4;
  // Keyed by referenced data file path.
  map<string, IcebergOldDeleteMergeTarget> old_deletes = 5;
}

message ConnectorWriterHandle {
  oneof handle {
    IcebergWriterHandle iceberg = 10;
  }
}

// ---------------------------------------------------------------------------
// Commit fragment: one staged provider artifact (BE -> FE)
// ---------------------------------------------------------------------------

message IcebergDataFileArtifact {
  string path = 1;
  IcebergFileFormat file_format = 2;
  IcebergArtifactPartition partition = 3;
  IcebergArtifactMetrics metrics = 4;
  optional int64 first_row_id = 5;
}

message IcebergPositionDeleteFileArtifact {
  string path = 1;
  IcebergArtifactPartition partition = 2;
  IcebergArtifactMetrics metrics = 3;
  string referenced_data_file = 4;
  // The old artifacts this file supersedes, so the commit can retire exactly
  // those and no others.
  repeated string merged_old_references = 5;
}

message IcebergDeletionVectorArtifact {
  string path = 1;
  IcebergArtifactPartition partition = 2;
  IcebergArtifactMetrics metrics = 3;
  string referenced_data_file = 4;
  IcebergContentRange content_range = 5;
  uint64 cardinality = 6;
  repeated string merged_old_references = 7;
}

// Exactly one staged Iceberg artifact.
//
// A fragment carries no writer identity, no attempt id, and no aggregate
// summary: those are properties of an execution, not of an artifact, and
// putting them here would make two identical artifacts look different.
message IcebergCommitFragment {
  oneof artifact {
    IcebergDataFileArtifact data_file = 1;
    IcebergPositionDeleteFileArtifact position_delete_file = 2;
    IcebergDeletionVectorArtifact deletion_vector = 3;
  }
}

message ConnectorCommitFragment {
  oneof fragment {
    IcebergCommitFragment iceberg = 10;
  }
}
