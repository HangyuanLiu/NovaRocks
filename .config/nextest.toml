nextest-version = { required = "0.9.148" }

[profile.default]
test-threads = 4
retries = 0
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 5, grace-period = "10s" }
leak-timeout = { period = "1s", result = "fail" }

[profile.default.junit]
path = "junit.xml"

[test-groups.native-process]
max-threads = 2

[test-groups.process-mechanics]
max-threads = 2

# These targets start native servers or clusters and consume two global slots.
[[profile.default.overrides]]
filter = 'package(/novarocks-cluster-harness/) | (package(/novarocks-server/) & binary(/server_binary_smoke/))'
test-group = "native-process"
threads-required = 2
slow-timeout = { period = "60s", terminate-after = 10, grace-period = "10s" }

# Fault-injection mechanics intentionally fan out payload processes. Pure unit
# tests, allocator tests and panic-hook tests retain ordinary parallel scheduling.
[[profile.default.overrides]]
filter = 'package(/novarocks-test-support/) & binary(/process_(monitor|retention)/)'
test-group = "process-mechanics"
