# Own workspace root. The repository root manifest excludes this directory so the
# runner keeps its own [profile.*] tables, but relying on that exclusion alone
# breaks whenever the checkout lives inside another checkout (for example a git
# worktree under <repo>/.claude/worktrees/): cargo then walks past the local
# root and lands on the outer workspace, which neither lists nor excludes this
# path. Declaring an empty workspace here stops that upward search.
[workspace]

[package]
name = "novarocks-sql-test-runner"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "sql-tests"
path = "src/main.rs"

[[bin]]
name = "fenced-catalog-fixture"
path = "src/bin/fenced-catalog-fixture.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
mysql = "25.0.1"
novarocks-cluster-harness = { path = "../cluster-harness" }
rayon = "1.10"
regex = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
opendal = { version = "0.55", features = ["services-fs", "services-s3"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time", "sync", "signal"] }

[dev-dependencies]
tempfile = "3"

[profile.dev-opt]
inherits = "dev"
opt-level = 1
debug = 1
incremental = true
lto = false
codegen-units = 256
