name: Admission

on:
  merge_group:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admission:
    name: admission
    if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env: &admission_env
      CARGO_BUILD_JOBS: "4"
      NOVA_CI_CARGO_PROFILE: dev
      NOVA_ADMISSION_RUNNER_LABEL: ubuntu-24.04
      NOVA_CI_CARGO_DENY_VERSION: "0.20.2"
      NOVA_CI_NEXTEST_VERSION: "0.9.148"
    steps: &admission_steps
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake libclang-dev libssl-dev pkg-config

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Restore Cargo downloads
        id: cargo_downloads
        uses: actions/cache/restore@v4
        with:
          path: &cargo_download_paths |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-downloads-v1-${{ hashFiles('**/Cargo.lock') }}-deny-${{ env.NOVA_CI_CARGO_DENY_VERSION }}-nextest-${{ env.NOVA_CI_NEXTEST_VERSION }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-downloads-v1-

      - name: Add pinned tools to PATH
        run: echo "$RUNNER_TEMP/admission-tools/bin" >> "$GITHUB_PATH"

      - name: Restore pinned Cargo tools
        id: cargo_tools
        uses: actions/cache/restore@v4
        with:
          path: &cargo_tool_path ${{ runner.temp }}/admission-tools
          key: ${{ runner.os }}-${{ runner.arch }}-${{ env.NOVA_ADMISSION_RUNNER_LABEL }}-cargo-tools-v1-${{ hashFiles('rust-toolchain.toml') }}-deny-${{ env.NOVA_CI_CARGO_DENY_VERSION }}-nextest-${{ env.NOVA_CI_NEXTEST_VERSION }}

      - name: Install pinned cargo-deny
        if: steps.cargo_tools.outputs.cache-hit != 'true'
        run: cargo install cargo-deny --version "$NOVA_CI_CARGO_DENY_VERSION" --locked --root "$RUNNER_TEMP/admission-tools"

      - name: Install pinned nextest
        if: steps.cargo_tools.outputs.cache-hit != 'true'
        run: cargo install cargo-nextest --version "$NOVA_CI_NEXTEST_VERSION" --locked --root "$RUNNER_TEMP/admission-tools"

      - name: Verify pinned Cargo tools
        run: |
          deny_version="$(cargo deny --version)"
          nextest_version="$(cargo nextest --version)"
          echo "$deny_version"
          echo "$nextest_version"
          [[ "$deny_version" == "cargo-deny $NOVA_CI_CARGO_DENY_VERSION" ]]
          [[ "$nextest_version" == "cargo-nextest $NOVA_CI_NEXTEST_VERSION" || "$nextest_version" == "cargo-nextest $NOVA_CI_NEXTEST_VERSION "* ]]

      - name: Save pinned Cargo tools
        if: steps.cargo_tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: *cargo_tool_path
          key: ${{ steps.cargo_tools.outputs.cache-primary-key }}

      - name: Fetch locked workspace dependencies
        run: |
          host="$(rustc -vV | sed -n 's/^host: //p')"
          test -n "$host"
          cargo fetch --locked --target "$host"

      # Save before native validation so later test failures cannot prevent it.
      - name: Save Cargo downloads
        if: steps.cargo_downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: *cargo_download_paths
          key: ${{ steps.cargo_downloads.outputs.cache-primary-key }}

      - name: Run admission
        # Leave time for the always-run material upload after a native timeout.
        timeout-minutes: 150
        run: tools/ci/admission.sh --output "$RUNNER_TEMP/admission"

      - name: Publish admission summary
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          # Keep the entire step below GitHub's 1 MiB upload limit. The full
          # report and native materials remain unchanged for artifact upload.
          limit = 512 * 1024
          source = Path(os.environ["RUNNER_TEMP"]) / "admission/summary.md"
          destination = Path(os.environ["GITHUB_STEP_SUMMARY"])
          artifact = "admission-{}-{}".format(os.environ["GITHUB_RUN_ID"], os.environ["GITHUB_RUN_ATTEMPT"])
          run_url = "{}/{}/actions/runs/{}".format(
              os.environ["GITHUB_SERVER_URL"], os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_RUN_ID"])
          footer = ("\n\n---\nComplete summary and raw materials: artifact `" + artifact
                    + "` on [this workflow run](" + run_url
                    + "). Available after successful artifact upload.\n").encode("utf-8")
          previous_size = destination.stat().st_size if destination.exists() else 0
          available = limit - previous_size
          budget = max(0, available - len(footer))
          if source.is_file():
              with source.open("rb") as stream:
                  preview = stream.read(budget + 1)
              if len(preview) > budget:
                  notice = ("\n\nPreview truncated; complete summary is "
                            + str(source.stat().st_size) + " bytes.\n").encode("utf-8")
                  preview = preview[:max(0, budget - len(notice))]
                  # Retain complete Markdown lines and UTF-8 characters.
                  preview = preview.rsplit(b"\n", 1)[0] if b"\n" in preview else b""
                  preview = preview.decode("utf-8", errors="ignore").encode("utf-8") + notice
          else:
              preview = b"Admission summary was not produced; inspect the preceding steps.\n"
          payload = preview + footer
          if len(payload) <= available:
              with destination.open("ab") as stream:
                  stream.write(payload)
          else:
              print("No space remains for the admission preview; inspect the workflow artifact after upload.")
          PY

      - name: Upload admission materials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admission-${{ github.run_id }}-${{ github.run_attempt }}
          # A fresh checkout owns only this job's native attempts. Preserve them
          # even if the entry fails before recording its attempt_root.
          path: |
            ${{ runner.temp }}/admission
            logs/ci-full
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  # Design: ADR-0188 (docs/adr/ADR-0188-optional-pr-validation-and-formal-admission.md)
  pr_validation:
    name: pr-validation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env: *admission_env
    concurrency:
      group: pr-validation-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps: *admission_steps

  precheck:
    name: precheck
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: precheck-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Run fast repository prechecks
        run: |
          # These registered stages never consume a prepared artifact receipt.
          stages=(
            'cargo fmt'
            'generated artifact hygiene'
            'legacy branding'
            'legacy branding tests'
          )
          for stage in "${stages[@]}"; do
            tools/ci/local-full-ci.sh --run-stage "$stage" \
              "$RUNNER_TEMP/precheck-no-artifacts.json" "$RUNNER_TEMP/precheck"
          done
