[package]
name = "novarocks-server"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[[bin]]
name = "novarocks"
path = "src/main.rs"

[dependencies]
novarocks = { path = "../novarocks/core" }
novarocks-frontend = { path = "../novarocks/frontend" }
anyhow = "1"
ctrlc = "3.4"
libc = "0.2"
tracing = "0.1"

[features]
compat = ["novarocks/compat"]
foundationdb-provider = ["novarocks/foundationdb-provider"]
mysql-state-store-provider = ["novarocks/mysql-state-store-provider"]

[dev-dependencies]
# E2E tests that spawn the `novarocks` binary and drive it over MySQL / HTTP.
mysql = "25"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
