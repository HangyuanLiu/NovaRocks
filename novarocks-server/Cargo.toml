[package]
name = "novarocks-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "novarocks"
path = "src/main.rs"

[dependencies]
novarocks-server-application = { path = "library", default-features = false }

[features]
default = ["jemalloc"]
mem-1-m07-hms-listing-observe = ["novarocks-server-application/mem-1-m07-hms-listing-observe"]
mem-1-m07-closing-pressure = ["novarocks-server-application/mem-1-m07-closing-pressure"]
mem-1-m07-root-observation = ["novarocks-server-application/mem-1-m07-root-observation"]
mem-1-m07-exact-mysql-write = ["novarocks-server-application/mem-1-m07-exact-mysql-write"]
jemalloc = ["novarocks-server-application/jemalloc"]
native-compatibility-test-fixture = ["novarocks-server-application/native-compatibility-test-fixture"]
physical-wire-v2-candidate = ["novarocks-server-application/physical-wire-v2-candidate"]

[dev-dependencies]
libc.workspace = true
novarocks-failpoint.workspace = true
mysql.workspace = true
novarocks-test-support.workspace = true
novarocks-server-application = { path = "library", default-features = false }
tempfile.workspace = true
