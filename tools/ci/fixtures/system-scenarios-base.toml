# Provider-neutral base configuration for native 1FE+3BE system scenarios.
#
# `novarocks-cluster-harness` owns the real launch contract and rewrites the
# volatile parts of this file per process: it inserts `[cluster] role`, the BE
# endpoint list, every port, and a per-run `[state_store] path`. Only the
# provider-neutral, non-volatile fields belong here.
#
# It also materializes one mandatory `[native_trust]` table for every generated
# FE/BE config. The generated TOML retains only an `${ENV:...}` reference for
# the ephemeral test secret; the fixture deliberately contains no reusable
# trust secret, certificate path, or TLS mode. Individual system scenarios
# select authenticated plaintext, automatic TLS, or generated PEM TLS through
# the harness-owned profile.
#
# Deliberately absent:
#
# - `[connector.object_store]`: every registered scenario creates its Iceberg
#   warehouse on the local filesystem under the harness runtime directory, so
#   the system stage needs neither MinIO nor the iceberg-rest Docker fixture.
# - FoundationDB / MySQL StateStore settings: this baseline stays on SQLite so a
#   feature-enabled binary running it proves coexistence only, never that a
#   query used a specific StateStore provider.

[state_store]
provider = "sqlite"
cluster_id = "novarocks-system-scenarios"
path = "tmp/system-scenarios-state-store.sqlite"
deployment_owner = "fe-1"

[standalone_server]
mysql_port = 9030
user = "root"
