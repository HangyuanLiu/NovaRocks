[package]
name = "novarocks"
version = "0.1.0"
edition = "2024"
build = "src/build.rs"

[lib]
doctest = false

[[bin]]
name = "state-store-foundationdb-helper"
path = "tests/support/state_store_foundationdb_helper.rs"
required-features = ["foundationdb-provider", "state-store-test-hooks"]
test = false
bench = false

[[bin]]
name = "state-store-mysql-helper"
path = "tests/support/state_store_mysql_helper.rs"
required-features = ["mysql-state-store-provider", "state-store-test-hooks"]
test = false
bench = false

[dependencies]
# logging/config
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "time"] }
chrono = "0.4"
chrono-tz = "0.10"
atty = "0.2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# engine/connectors
arrow = { version = "58.2.0", features = ["prettyprint", "ipc", "ipc_compression"] }
arrow-buffer = { version = "58.2.0" }
arrow-data = { version = "58.2.0" }
parquet = { version = "58.2.0", features = ["arrow", "variant_experimental"] }
orc-rust = { version = "0.8.0", default-features = false }
apache-avro = "0.21.0"
iceberg = "0.9.0"
iceberg-catalog-rest = "0.9.0"
iceberg-catalog-hms = "0.9.0"
typetag = "0.2"
opendal = { version = "0.55", features = ["services-oss", "services-fs", "services-s3", "services-hdfs-native", "services-memory"] }
futures = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
mysql = "25"
mysql_common = "0.32"
mysql_async = { version = "=0.37.0", optional = true, default-features = false, features = ["minimal-rust", "rustls-tls", "ring", "tls12"] }
rustls = { version = "0.23", optional = true, default-features = false }
url = "2"
rand = "0.8"
regex = "1.10"
sqlparser = "0.61.0"
hex = "0.4"
libm = "0.2"
num-traits = "0.2"
ordered-float = "4"
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
fs2 = "0.4"
as-any = "0.3"
opensrv-mysql = { version = "0.7", default-features = false }
foundationdb = { version = "=0.11.0", optional = true, default-features = false, features = ["embedded-fdb-include", "fdb-7_3"] }

# starust core
thrift = "0.17"
threadpool = "1"
serde_json = "1"
bytes = "1"
csv = "1"
hashbrown = { version = "0.14", features = ["raw"] }
prost = "0.13"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tonic = { version = "0.12", features = ["transport"] }
axum = "0.7"
tokio-stream = "0.1"
ctrlc = "3.4"
prometheus = "0.13"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
md-5 = "0.10"
openssl = "0.10"
sha2 = "0.10"
sm3 = "0.4"
twox-hash = "2.1"
ryu = "1"

# cache
moka = { version = "0.12", features = ["sync"] }
once_cell = "1.19"
libc = "0.2"
num_cpus = "1"
crc32c = "0.6"
crc32fast = "1"
lz4_flex = "0.11"
roaring = "0.10"
datasketches = "0.2.0"
tdigest = { version = "0.2.3", features = ["use_serde"] }

[dev-dependencies]
tempfile = "3"
mockito = "1"

[features]
foundationdb-provider = ["dep:foundationdb"]
mysql-state-store-provider = ["dep:mysql_async", "dep:rustls"]
state-store-test-hooks = []
ssb = []
compat = []

[build-dependencies]
cc = "1.2"
protoc-bin-vendored = "3"
tonic-build = "0.12"
which = "6"

[profile.dev]
opt-level = 0
debug = 2
incremental = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Balanced profile for the dev/test loop: opt-level 1 gives a large runtime
# speedup over dev (opt-level 0) while keeping compile times far below release.
# debug = 1 (line tables only) trims debug-info/link cost; codegen-units = 256
# and lto = false keep codegen highly parallel. Build with `--profile dev-opt`;
# artifacts land under target/dev-opt/.
[profile.dev-opt]
inherits = "dev"
opt-level = 1
debug = 1
incremental = true
lto = false
codegen-units = 256

# Vendored iceberg-rust 0.9 with two visibility patches that allow downstream
# crates to implement custom Transaction actions (TransactionAction trait + the
# TableCommit::builder().build() method). Required by NovaRocks RowDeltaCommit
# and OverwriteCommit (Plan Tasks 9 / 10) until upstream ships native RowDelta
# and OverwriteFiles actions. See vendor/iceberg-0.9.0/PATCH.md for the diff.
[patch.crates-io]
iceberg = { path = "vendor/iceberg-0.9.0" }
# Vendored to add Iceberg view REST endpoints (create/load/commit/drop/
# exists/list) that upstream 0.9.0 does not implement. See
# vendor/iceberg-catalog-rest-0.9.0/PATCH.md.
iceberg-catalog-rest = { path = "vendor/iceberg-catalog-rest-0.9.0" }
# Vendored to add a `PrimitiveType::Variant` match arm. The vendored iceberg's
# PATCH 6 adds that enum member (Iceberg v3 variant), which is not additive for
# the crate's exhaustive Hive type match, so crates.io 0.9.0 won't compile
# against it. See vendor/iceberg-catalog-hms-0.9.0/PATCH.md.
iceberg-catalog-hms = { path = "vendor/iceberg-catalog-hms-0.9.0" }
