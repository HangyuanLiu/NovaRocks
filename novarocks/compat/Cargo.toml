[package]
name = "novarocks-compat"
version = "0.1.0"
edition = "2024"
autotests = false

[lib]
doctest = false

[[bin]]
name = "starrocks-compat-probe"
path = "../../tests/starrocks-compat-probe/main.rs"
test = false
bench = false

[dependencies]
novarocks = { path = "../core", features = ["compat"] }
novarocks-fs = { path = "../fs" }
anyhow = "1"
prost = "0.13"
base64 = "0.22"
hex = "0.4"
thrift = "0.17"
serde_json = "1"
rand = "0.8"
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread"] }
