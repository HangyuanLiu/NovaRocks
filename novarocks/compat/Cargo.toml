[package]
name = "novarocks-compat"
version = "0.1.0"
edition = "2024"
autotests = false

[lib]
doctest = false

[features]
default = ["compat"]
compat = []

[[bin]]
name = "starrocks-compat-probe"
path = "../../tests/starrocks-compat-probe/main.rs"
test = false
bench = false

[dependencies]
novarocks = { path = "../core", features = ["compat"] }
novarocks-fs = { path = "../fs" }
novarocks-spi = { path = "../spi" }
novarocks-types = { path = "../types" }
anyhow = "1"
prost = "0.13"
base64 = "0.22"
hex = "0.4"
thrift = "0.17"
serde_json = "1"
rand = "0.8"
chrono = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread"] }
libc = "0.2"
arrow = "58.2.0"
arrow-buffer = "58.2.0"
bytes = "1"
csv = "1"
iceberg = "0.9.0"
parquet = { version = "58.2.0", features = ["arrow", "variant_experimental"] }
tonic = { version = "0.12", features = ["transport"] }
tracing = "0.1"
