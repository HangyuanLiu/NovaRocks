[package]
name = "novarocks-frontend"
version = "0.1.0"
edition = "2024"

[lib]
doctest = false

[dependencies]
async-trait = "0.1"
bytes = "1"
novarocks = { path = "../core" }
novarocks-state-store = { path = "../state-store" }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "signal"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = "1"
