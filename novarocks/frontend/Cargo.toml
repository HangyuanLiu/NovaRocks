[package]
name = "novarocks-frontend"
version = "0.1.0"
edition = "2024"

[lib]
doctest = false

[dependencies]
async-trait = "0.1"
arrow = { version = "58.2.0" }
bytes = "1"
hex = "0.4"
novarocks = { path = "../core" }
novarocks-catalog = { path = "../catalog" }
novarocks-spi = { path = "../spi" }
novarocks-state-store = { path = "../state-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlparser = "0.61.0"
tokio = { version = "1", features = ["rt-multi-thread", "signal"] }
uuid = { version = "1", features = ["v7", "serde"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
