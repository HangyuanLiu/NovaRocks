[package]
name = "novarocks-backend"
version = "0.1.0"
edition = "2024"

[lib]
doctest = false

[dependencies]
novarocks = { path = "../core" }
novarocks-spi = { path = "../spi" }
prost = "0.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }

[dev-dependencies]
bytes = "1"
novarocks = { path = "../core", features = ["query-execution-contract-test-support"] }
tokio-stream = "0.1"
tonic = { version = "0.12", features = ["transport"] }
