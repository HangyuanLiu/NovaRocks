syntax = "proto3";

package novarocks.mv.persistence.v1;

// One immutable domain publication. Provider-native output versions and
// application-level revisions/watermarks remain separate facts.
message PublicationDocument {
  optional uint32 format_version = 1;
  optional bytes publication_id = 2;
  optional bytes definition_revision = 3;
  optional bytes interpretation_revision = 4;
  repeated PublicationInput inputs = 5;
  optional PublicationOutput output = 6;
  optional PublicationKind kind = 7;
  optional PublicationStatistics statistics = 8;
}

message PublicationInput {
  optional uint32 relation_occurrence_id = 1;
  optional bytes object_id = 2;
  optional bytes native_data_version = 3;
}

message PublicationOutput {
  optional bytes object_id = 1;
  optional bytes native_data_version = 2;
  optional bool empty_result = 3;
}

enum PublicationKind {
  PUBLICATION_KIND_UNSPECIFIED = 0;
  PUBLICATION_KIND_FULL_REFRESH = 1;
  PUBLICATION_KIND_INCREMENTAL_REFRESH = 2;
  PUBLICATION_KIND_METADATA_ONLY_REFRESH = 3;
  PUBLICATION_KIND_REPARTITION = 4;
}

// These application-level execution counters have distinct meanings. They
// must not be copied into one ambiguous `rows` field.
message PublicationStatistics {
  optional uint64 logical_result_rows = 1;
  optional uint64 processed_input_rows = 2;
}
