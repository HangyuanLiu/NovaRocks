syntax = "proto3";

package novarocks.mv.persistence.v1;

// Mutable product policy is intentionally independent of computation identity
// and immutable D/L revisions.
message ConfigurationDocument {
  optional uint32 format_version = 1;
  optional RefreshPolicy refresh_policy = 2;
  optional bool paused = 3;
  optional uint64 refresh_interval_ms = 4;
  optional uint64 max_staleness_ms = 5;
}

enum RefreshPolicy {
  REFRESH_POLICY_UNSPECIFIED = 0;
  REFRESH_POLICY_MANUAL = 1;
  REFRESH_POLICY_ASYNC_ON_CHANGE = 2;
  REFRESH_POLICY_ASYNC_INTERVAL = 3;
}
