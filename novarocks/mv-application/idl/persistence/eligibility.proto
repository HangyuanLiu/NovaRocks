syntax = "proto3";
package novarocks.mv.persistence.v1;

// A bounded control fact attached to target table metadata. It is independent
// of configuration and records validation of an exact published content basis.
message EligibilityDocument {
  optional uint32 format_version = 1;
  optional bytes object_id = 2;
  optional bytes publication_id = 3;
  optional bytes publication_revision = 4;
  optional bytes computation_identity = 5;
  optional bytes content_contract_identity = 6;
  optional uint64 generation = 7;
  optional EligibilityState state = 8;
  optional bytes attempt = 9;
  optional bytes target_snapshot = 10;
  optional uint64 requested = 11;
  optional uint64 matched = 12;
  repeated bytes samples = 13;
}
enum EligibilityState {
  ELIGIBILITY_STATE_UNSPECIFIED = 0;
  ELIGIBILITY_STATE_ELIGIBLE = 1;
  ELIGIBILITY_STATE_VALIDATION_PENDING = 2;
  ELIGIBILITY_STATE_INVALID = 3;
}
