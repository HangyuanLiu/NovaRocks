[package]
name = "novarocks-types"
version = "0.1.0"
edition = "2024"

[lib]
doctest = false

[dependencies]
arrow = { version = "58.2.0" }
arrow-buffer = "58.2.0"
base64 = "0.22"
chrono = "0.4"
num-traits = "0.2"
roaring = "0.10"
ryu = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v7"] }

[dev-dependencies]
toml = "0.8"
