[package]
name = "novarocks-mysql-adapter"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Private finite Closing pressure instrumentation; default-off and independent of the exact fixture.
mem-1-m07-closing-pressure = ["dep:sha2"]
mem-1-m07-exact-mysql-write = ["dep:sha2", "novarocks-query-application/mem-1-m07-exact-mysql-write"]

[dependencies]
async-trait.workspace = true
arrow.workspace = true
libc.workspace = true
mysql_common = "0.32"
novarocks-query-application.workspace = true
novarocks-result-contract.workspace = true
novarocks-result-render.workspace = true
novarocks-types.workspace = true
novarocks-workload-control.workspace = true
opensrv-mysql = { version = "0.7", default-features = false }
sha2 = { workspace = true, optional = true }
tokio = { workspace = true, features = ["net", "rt", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
novarocks-execution-contract.workspace = true
sha2.workspace = true
novarocks-parser.workspace = true
novarocks-query-application = { workspace = true, features = ["test-support"] }
novarocks-sql.workspace = true
novarocks-user-error.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }
