[package]
name = "novarocks-spi"
version = "0.1.0"
edition = "2024"

[lib]
doctest = false

[dependencies]
async-trait = "0.1"
arrow = { version = "58.2.0" }
bytes = "1"
sha2 = "0.10"
tokio = { version = "1", optional = true, features = ["macros", "rt", "sync", "time"] }
uuid = { version = "1", features = ["v7"] }

[features]
connector-conformance = []
state-store-conformance = ["dep:tokio"]
