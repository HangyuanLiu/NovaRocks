[package]
name = "novarocks-worker"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
doctest = false

[features]
normal-build = ["novarocks-execution/normal-build", "novarocks-failpoint?/normal-build"]
test-controls = ["novarocks-execution/test-controls", "dep:novarocks-failpoint", "novarocks-failpoint/test-controls"]
test-support = []

[dependencies]
novarocks-failpoint = { workspace = true, optional = true }
arrow.workspace = true
async-trait.workspace = true
bytes.workspace = true
futures.workspace = true
novarocks-execution-contract.workspace = true
novarocks-execution.workspace = true
novarocks-memory.workspace = true
novarocks-result-contract.workspace = true
novarocks-spi.workspace = true
novarocks-types.workspace = true
novarocks-type-contract.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
uuid = { workspace = true, features = ["v4"] }
tracing.workspace = true

[dev-dependencies]
novarocks-functions.workspace = true
