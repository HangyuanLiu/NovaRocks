[package]
name = "novarocks-state-store"
version = "0.1.0"
edition = "2024"

[lib]
doctest = false

[[bin]]
name = "state-store-foundationdb-helper"
path = "tests/support/state_store_foundationdb_helper.rs"
required-features = ["foundationdb-provider", "state-store-test-hooks"]
test = false
bench = false

[[bin]]
name = "state-store-mysql-helper"
path = "tests/support/state_store_mysql_helper.rs"
required-features = ["mysql-state-store-provider", "state-store-test-hooks"]
test = false
bench = false

[dependencies]
anyhow = "1"
async-trait = "0.1"
bytes = "1"
foundationdb = { version = "=0.11.0", optional = true, default-features = false, features = ["embedded-fdb-include", "fdb-7_3"] }
fs2 = "0.4"
futures = "0.3"
hex = "0.4"
libc = "0.2"
mysql_async = { version = "=0.37.0", optional = true, default-features = false, features = ["minimal-rust", "rustls-tls", "ring", "tls12"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rustls = { version = "0.23", optional = true, default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }

[dev-dependencies]
tempfile = "3"
toml = "0.8"

[features]
foundationdb-provider = ["dep:foundationdb"]
mysql-state-store-provider = ["dep:mysql_async", "dep:rustls"]
state-store-test-hooks = []
