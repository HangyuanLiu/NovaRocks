[package]
name = "novarocks-state-store-foundationdb"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
doctest = false

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
bytes.workspace = true
foundationdb = { version = "=0.11.0", optional = true, default-features = false, features = ["embedded-fdb-include", "fdb-7_3"] }
futures.workspace = true
hex.workspace = true
novarocks-state-store-api.workspace = true
novarocks-secret.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true
uuid = { workspace = true, features = ["v4", "v7", "serde"] }

[dev-dependencies]
novarocks-state-store-testkit.workspace = true
tempfile.workspace = true

[[bin]]
name = "state-store-foundationdb-helper"
path = "tests/support/state_store_foundationdb_helper.rs"
required-features = ["foundationdb-provider", "state-store-test-hooks"]
test = false
bench = false

[features]
foundationdb-provider = ["dep:foundationdb"]
state-store-test-hooks = ["foundationdb-provider"]
provider-internal-tests = ["foundationdb-provider"]

[package.metadata.novarocks.test]
runtime-inputs = ["target/debug/state-store-foundationdb-helper"]
env-inputs = [{ name = "NOVAROCKS_FDB_CLUSTER_FILE", kind = "file-content" },{ name = "NOVAROCKS_FDB_KEYSPACE_ID", kind = "value" }]
ignored = [
  { filter = "test(=foundationdb::runtime::tests::running_runtime_drop_child)", class = "helper", reason = "exec helper used by running_runtime_drop_fails_fast" },
  { filter = "test(=foundationdb::runtime::tests::failed_runtime_with_running_thread_drop_child)", class = "helper", reason = "exec helper used by failed_runtime_with_running_thread_drop_fails_fast" },
  { filter = "test(=runtime_child_boot)", class = "helper", reason = "exec helper used by foundationdb_runtime_lifecycle" },
]
