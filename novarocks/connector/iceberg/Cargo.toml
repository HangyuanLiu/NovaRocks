[package]
name = "novarocks-connector-iceberg"
version = "0.1.0"
edition = "2024"

[lib]
doctest = false

[dependencies]
iceberg = "0.9.0"
iceberg-catalog-rest = "0.9.0"
iceberg-catalog-hms = "0.9.0"
opendal = { version = "0.55", features = ["services-oss", "services-fs", "services-s3", "services-hdfs-native", "services-memory"] }
arrow = { version = "58.2.0", features = ["prettyprint", "ipc", "ipc_compression"] }
bytes = "1"
datasketches = "0.2.0"
ordered-float = "4"
serde = { version = "1", features = ["derive"] }
novarocks-catalog = { path = "../../catalog" }
novarocks-fs = { path = "../../fs" }
novarocks-spi = { path = "../../spi" }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
