[[package.metadata.novarocks.test.ignored]]
filter = "test(=exec::expr::legacy_percentile_approx_raw_original_tests::legacy_percentile_approx_raw_original_child_prefix_precedes_any_row_error) | test(=exec::expr::legacy_percentile_approx_raw_original_tests::legacy_percentile_approx_raw_original_decode_full_header_errors_and_ignored_tail) | test(=exec::expr::legacy_percentile_approx_raw_original_tests::legacy_percentile_approx_raw_original_full_actual_carrier_errors_and_zero_rows) | test(=exec::expr::legacy_percentile_hash_original_tests::legacy_percentile_hash_original_all_numeric_readers_slice_null_and_empty) | test(=exec::expr::legacy_percentile_hash_original_tests::legacy_percentile_hash_original_first_only_demand_ignored_target_and_raw_arity) | test(=exec::expr::legacy_percentile_hash_original_tests::legacy_percentile_hash_original_full_carrier_error_null_mask_and_zero_rows) | test(=exec::expr::percentile_hash_original_fold_tests::hash_original_real_fe_fold_evaluates_cast_tail_before_hash)"
class = "manual"
reason = "Percentile maintenance is suspended; these retained legacy semantic diagnostics are outside the maintained compiled execution contract."
